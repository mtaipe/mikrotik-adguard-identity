services:
  identity-sync:
    build:
      context: .
      platforms:
        - linux/arm64
    image: docker.io/mtaipe/mikrotik-adguard-identity:1
    container_name: mikrotik-adguard-identity
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1514:1514/udp"
      - "8080:8080/tcp"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
