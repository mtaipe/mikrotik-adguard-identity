name: Publish ARM64 image to Docker Hub

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build:
    runs-on: docker-runner

    container:
      image: docker.gitea.com/runner-images:ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: mikrotik-adguard-identity

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ gitea.ref_name }}

      - name: Check Docker Hub configuration
        shell: bash
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "DOCKERHUB_USERNAME is missing"
            exit 1
          }

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || {
            echo "DOCKERHUB_TOKEN is missing"
            exit 1
          }

          printf '%s\n' "$DOCKERHUB_TOKEN" | \
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker Hub tags
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE"

          VERSION="${RELEASE_TAG#v}"

          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
