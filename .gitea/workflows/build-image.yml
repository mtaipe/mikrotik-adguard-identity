name: Build and push ARM64 image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ${{ vars.REGISTRY_SITE }}/${{ vars.REGISTRY_PATH }}/mikrotik-adguard-identity

jobs:
  build:
    runs-on: docker-runner

    container:
      image: docker.gitea.com/runner-images:ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check registry configuration
        shell: bash
        env:
          REGISTRY_SITE: ${{ vars.REGISTRY_SITE }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$REGISTRY_SITE"  || { echo "REGISTRY_SITE is missing"; exit 1; }
          test -n "$REGISTRY_PATH"  || { echo "REGISTRY_PATH is missing"; exit 1; }
          test -n "$REGISTRY_USER"  || { echo "REGISTRY_USER is missing"; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo "REGISTRY_TOKEN is missing"; exit 1; }

      - name: Login to registry
        shell: bash
        env:
          REGISTRY_SITE: ${{ vars.REGISTRY_SITE }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | \
            docker login "$REGISTRY_SITE" \
              --username "$REGISTRY_USER" \
              --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ gitea.ref_type }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            {
              echo "tags<<EOF"
              echo "$IMAGE:$REF_NAME"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$IMAGE:main"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
